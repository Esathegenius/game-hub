<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ball Run Download</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🎮 Ball Run Download</a>
    <div id="accountArea" class="account-area hidden">
      <span id="accountEmail" class="muted"></span>
      <a class="admin-link" href="admin.html">Admin</a>
      <button id="logout" class="secondary small-button">Log out</button>
    </div>
  </header>

  <main class="container">
    <section id="loginPanel" class="panel login-panel">
      <p class="eyebrow">CLASS GAME HUB</p>  
      <h1>Welcome 👋</h1>
      <p class="muted">Sign in with your class account (i emailed) to access my games.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="loginMessage" class="message"></p>
    </section>

    <section id="gameArea" class="hidden">
      <section class="hero">
        <p class="eyebrow">MY GAME COLLECTION</p>
        <h1>Ball Run Download</h1>
        <p>Games made for our class.</p>
      </section>

      <div id="status" class="status">Loading games…</div>
      <section id="games" class="grid"></section>

      <section class="chat panel">
        <div class="chat-header">
          <div>
            <p class="eyebrow">WRITE QUESTIONS IN THE CHAT</p>
            <h2>💬 Chat</h2>
          </div>
          <span id="chatStatus" class="muted">Connecting…</span>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chatForm" class="chat-form">
          <input id="messageInput" maxlength="500" autocomplete="off" placeholder="Type a message…" required>
          <button type="submit">Send</button>
        </form>
        <p class="chat-note">Messages are visible to everyone who can log in.</p>
      </section>
      
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
