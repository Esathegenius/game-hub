<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Game Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🎮 Game Hub</a>
    <a class="admin-link" href="index.html">Back to games</a>
  </header>

  <main class="container admin">
    <section id="loginPanel" class="panel">
      <p class="eyebrow">ADMIN AREA</p>
      <h1>Sign in</h1>
      <p class="muted">Only your approved admin account can upload games.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="loginMessage" class="message"></p>
    </section>

    <section id="dashboard" class="panel hidden">
      <div class="panel-head">
        <div>
          <p class="eyebrow">ADMIN PANEL</p>
          <h1>Upload a game</h1>
        </div>
        <button id="logout" class="secondary">Log out</button>
      </div>

      <form id="gameForm">
        <label>Game name<input id="name" required maxlength="80"></label>
        <label>Description<textarea id="description" required maxlength="500"></textarea></label>
        <label>Version<input id="version" value="1.0.0" maxlength="30"></label>
        <label>Game ZIP<input id="zip" type="file" accept=".zip,application/zip" required></label>
        <label>Thumbnail <span class="muted">(optional)</span><input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label>
        <button type="submit">Upload game</button>
      </form>
      <p id="uploadMessage" class="message"></p>

      <h2>Your games</h2>
      <div id="adminGames" class="admin-list"></div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
